# Run R script to split markdown and re-render quarto webpage
name: Split contents and render webpage

on:
  workflow_dispatch:
  push:
    branches: main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
      - name: Install R
        uses: r-lib/actions/setup-r@v2 
      - name: Set up R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2 
        with:
          packages: |
            github::quarto-dev/quarto-r
      - name: Run script to split readme
        run: Rscript split_markdown.R
      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
